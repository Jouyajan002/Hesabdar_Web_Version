<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چاپ</title>
<!--
  print-window.html — پنجرهٔ چاپِ جداگانه (فقط نسخهٔ نصبیِ ویندوز / Tauri)
  ---------------------------------------------------------------------------
  چرا این فایل وجود دارد؟
  پنجرهٔ «تنظیماتِ چاپ» را خودِ WebView2 می‌سازد و همیشه به اندازهٔ پنجره‌ای که چاپ از آن
  شروع شده کشیده می‌شود. وقتی برنامه تمام‌صفحه است، آن پنجره هم تمام‌قد و بزرگ می‌شود.
  راهِ حل: چاپ از یک پنجرهٔ متوسطِ وسط‌چین انجام می‌شود؛ پس پیش‌نمایش و تنظیماتِ چاپ هم
  به اندازهٔ همین پنجره، جمع‌وجور و کامل دیده می‌شوند و پنجرهٔ اصلیِ برنامه هیچ تغییری
  نمی‌کند. پیش‌نمایشِ اورلیِ داخلِ برنامه هم سرِ جای خودش باقی است.

  محتوا از پنجرهٔ اصلی با رویدادِ Tauri می‌آید (نه localStorage) تا دادهٔ حجیمِ بل هرگز
  وارد حافظهٔ محلیِ برنامه نشود. یک «توکن» در نشانیِ همین صفحه هست تا اگر چند بار پشتِ‌سرِهم
  چاپ بزنید، هیچ‌وقت محتوای بلِ قبلی به پنجرهٔ تازه نرسد.

  این فایل هیچ اسکریپتِ بیرونی‌ای از برنامه بار نمی‌کند، پس مراحلِ درهم‌ریزی/رمزنگاریِ
  بیلد (که فقط فایل‌های .js را پردازش می‌کنند) به آن کاری ندارند.
-->
<link rel="stylesheet" href="assets/fonts/estedad.css">
<link rel="stylesheet" href="assets/fonts/vazirmatn.css">
<link rel="stylesheet" href="assets/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    font-family: Estedad, Vazirmatn, Tahoma, sans-serif;
    background: #eef2f7; direction: rtl; overflow: hidden;
  }
  #hb-bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #1e3a5f; color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  #hb-bar .hb-title { font-size: 13.5px; font-weight: 700; margin-right: auto; opacity: .92; }
  #hb-bar button {
    cursor: pointer; border: none; border-radius: 8px; padding: 8px 16px;
    font-size: 13px; font-weight: 700; font-family: inherit;
    display: inline-flex; align-items: center; gap: 7px; transition: filter .15s;
  }
  #hb-bar button:hover { filter: brightness(1.08); }
  .hb-b-print { background: #1de9b6; color: #0f172a; }
  .hb-b-close { background: rgba(255,255,255,.14); color: #fff; }
  #hb-wrap {
    flex: 1 1 auto; overflow: auto; padding: 14px;
    display: flex; justify-content: center; align-items: stretch;
  }
  #hb-frame {
    width: 100%; max-width: 840px; min-height: 360px;
    border: 1px solid #d7dfea; border-radius: 10px; background: #fff;
    box-shadow: 0 6px 20px rgba(15,23,42,.10);
  }
  #hb-msg { margin: auto; color: #64748b; font-size: 14px; }
  /* نوارِ بالا هرگز چاپ نشود (چاپ از داخلِ iframe انجام می‌شود، ولی محضِ احتیاط) */
  @media print { #hb-bar { display: none !important; } }
</style>
</head>
<body>

  <div id="hb-bar">
    <button type="button" class="hb-b-print" onclick="hbPrint()"><i class="fas fa-print"></i> چاپ</button>
    <button type="button" class="hb-b-close" onclick="hbClose()"><i class="fas fa-xmark"></i> بستن</button>
    <span class="hb-title">پیش‌نمایش چاپ</span>
  </div>

  <div id="hb-wrap"><div id="hb-msg">در حال آماده‌سازی…</div></div>

<script>
(function () {
  'use strict';
  var T = (typeof window !== 'undefined') ? (window.__TAURI__ || null) : null;
  var rendered = false;

  // توکنِ این پنجره — جلوی رسیدنِ محتوای بلِ قبلی را می‌گیرد
  var tok = '';
  try { tok = (new URLSearchParams(location.search)).get('t') || ''; } catch (e) { tok = ''; }
  var EV_READY = 'hb-print-ready' + (tok ? ('-' + tok) : '');
  var EV_HTML  = 'hb-print-html'  + (tok ? ('-' + tok) : '');

  // (APEX) پنجرهٔ واسطِ چاپِ بارکد (sys=1): ویندوز اندازهٔ کمینه‌ای به پنجره می‌دهد، پس
  //  محتوای آن «روی صفحه‌نمایش» کاملاً نامرئی (زمینهٔ شفاف، بدونِ نوارِ پیمایش) و پنجره
  //  نسبت به کلیک بی‌اثر می‌شود؛ هنگامِ چاپ (media print) لیبل کامل چاپ می‌شود.
  var SYS = false;
  try { SYS = (new URLSearchParams(location.search)).get('sys') === '1'; } catch (e) { SYS = false; }
  function sysHideScreen() {
    if (!SYS) return;
    try {
      var old = document.getElementById('hb-sys-hide'); if (old) old.parentNode.removeChild(old);
      var st = document.createElement('style');
      st.id = 'hb-sys-hide';
      st.textContent = '@media screen{html,body{background:transparent!important;overflow:hidden!important;}' +
        'html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important;}body *{visibility:hidden!important;}}';
      (document.head || document.documentElement).appendChild(st);
    } catch (e) {}
  }
  if (SYS) {
    sysHideScreen();
    try {
      var _cw = (T && T.window && typeof T.window.getCurrentWindow === 'function') ? T.window.getCurrentWindow() : null;
      if (_cw && typeof _cw.setIgnoreCursorEvents === 'function') Promise.resolve(_cw.setIgnoreCursorEvents(true)).catch(function () {});
    } catch (e) {}
  }

  function render(html) {
    if (rendered) return;
    rendered = true;
    var wrap = document.getElementById('hb-wrap');
    wrap.innerHTML = '';
    var f = document.createElement('iframe');
    f.id = 'hb-frame';
    f.setAttribute('title', 'پیش‌نمایش چاپ');
    wrap.appendChild(f);
    try {
      var d = f.contentWindow.document;
      d.open(); d.write(html); d.close();
    } catch (e) {
      try { f.srcdoc = html; } catch (_) {}
    }
    // کمی مکث تا فونت/تصویرها بیایند، سپس پنجرهٔ تنظیماتِ چاپ باز شود
    setTimeout(hbPrint, 500);
  }

  // ── (APEX) حالتِ «پنجرهٔ چاپِ ویندوز» (چاپِ بارکد روی پرنترِ حرارتی) ─────────────────
  //  سندِ لیبل خودش سندِ اصلیِ همین پنجره می‌شود و فرمانِ hb_print_system (Rust) پنجرهٔ چاپِ
  //  سیستمیِ ویندوز را باز می‌کند: انتخابِ پرنتر + دکمهٔ Preferences (تنظیماتِ درایورِ پرنتر:
  //  اندازهٔ لیبل/Stock، جهت، تیرگی …) — مثلِ ورد. اگر این فرمان در نسخهٔ نصب‌شده نباشد،
  //  همان پیش‌نمایشِ چاپِ قبلی باز می‌شود (هیچ چیزی نمی‌شکند).
  // (APEX) پنجرهٔ واسطِ چاپِ بارکد ۱×۱ و نامرئی است؛ کاربر فقط «پنجرهٔ چاپِ ویندوز» را می‌بیند.
  //  پس از بسته‌شدنِ پنجرهٔ چاپ (چاپ یا لغو)، این پنجرهٔ واسط هم خودکار بسته می‌شود.
  var EV_FB = 'hb-print-fallback' + (tok ? ('-' + tok) : '');
  var sysClosing = false;
  function sysCloseSoon(ms) {
    if (sysClosing) return;
    sysClosing = true;
    setTimeout(function () { try { window.hbClose(); } catch (e) {} }, ms || 0);
  }
  // فرمانِ چاپِ سیستمی نبود → پنجرهٔ اصلی از پیش‌نمایشِ خودش چاپ می‌کند و این پنجره بسته می‌شود
  function sysFallback() {
    var sent = false;
    try { if (T && T.event && typeof T.event.emit === 'function') { T.event.emit(EV_FB, Date.now()); sent = true; } } catch (e) {}
    if (sent) { sysCloseSoon(400); return; }
    try { window.print(); } catch (e) {}
  }
  function sysWatch() {
    var t0 = Date.now(), blurred = false, hadMain = null;
    // ۶ ثانیه مهلت تا کارِ چاپ کاملاً به پرنتر سپرده شود، بعد بستن
    window.addEventListener('blur', function () { blurred = true; });
    window.addEventListener('focus', function () { if (blurred || (Date.now() - t0) > 1500) sysCloseSoon(6000); });
    window.addEventListener('afterprint', function () { sysCloseSoon(6000); });
    setTimeout(function () { sysCloseSoon(0); }, 180000);   // ایمنی: حداکثر ۳ دقیقه
    // اگر پنجرهٔ اصلیِ برنامه بسته شد، این پنجرهٔ نامرئی هم بسته شود
    setInterval(function () {
      try {
        var W = T && T.window, ga = W && W.getAllWindows;
        if (typeof ga !== 'function') return;
        Promise.resolve(ga.call(W)).then(function (list) {
          var has = false;
          (list || []).forEach(function (w) { if (w && w.label === 'main') has = true; });
          if (hadMain === null) { hadMain = has; return; }
          if (hadMain && !has) sysCloseSoon(0);
        }).catch(function () {});
      } catch (e) {}
    }, 3000);
  }
  function sysPrint() {
    try {
      if (T && T.core && typeof T.core.invoke === 'function') {
        T.core.invoke('hb_print_system').then(function (ok) { if (ok === true) sysWatch(); else sysFallback(); }, sysFallback);
        return;
      }
    } catch (e) {}
    sysFallback();
  }
  window.__hbSysPrint = sysPrint;

  function renderSystem(html) {
    if (rendered) return;
    // سندِ لیبل بدونِ document.open/write جایگزینِ محتوای همین صفحه می‌شود (head و body و ویژگی‌هایشان)
    try {
      var nd = new DOMParser().parseFromString(String(html), 'text/html');
      var copyAttrs = function (from, to) {
        var a, k;
        for (k = to.attributes.length - 1; k >= 0; k--) to.removeAttribute(to.attributes[k].name);
        for (k = 0; k < from.attributes.length; k++) { a = from.attributes[k]; to.setAttribute(a.name, a.value); }
      };
      copyAttrs(nd.documentElement, document.documentElement);
      copyAttrs(nd.body, document.body);
      document.head.innerHTML = nd.head.innerHTML;
      document.body.innerHTML = nd.body.innerHTML;
      sysHideScreen();
      rendered = true;
    } catch (e) {
      // نشد → چاپ از پیش‌نمایشِ داخلِ برنامه
      rendered = true;
      sysFallback();
      return;
    }
    setTimeout(sysPrint, 450);
  }

  window.hbPrint = function () {
    var f = document.getElementById('hb-frame');
    if (!f) { try { window.print(); } catch (e) {} return; }
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (e) { try { window.print(); } catch (_) {} }
  };

  window.hbClose = function () {
    try {
      if (T && T.window) {
        var get = T.window.getCurrentWindow || T.window.getCurrent;
        if (typeof get === 'function') {
          var W = get.call(T.window);
          if (W && typeof W.close === 'function') { W.close(); return; }
        }
      }
    } catch (e) {}
    try { window.close(); } catch (e) {}
  };

  if (T && T.event && typeof T.event.listen === 'function') {
    // دریافتِ محتوای بل از پنجرهٔ اصلی
    T.event.listen(EV_HTML, function (ev) {
      var h = ev && (ev.payload != null ? ev.payload : ev);
      if (typeof h === 'string' && h) {
        if (/<meta[^>]+name=["']?apex-sysprint/i.test(h.slice(0, 4000))) renderSystem(h); else render(h);
      }
      else if (h && typeof h === 'object' && typeof h.html === 'string' && h.html) {
        if (h.system) renderSystem(h.html); else render(h.html);
      }
    });
    // اعلامِ آمادگی — چند بار تکرار می‌شود تا اگر پنجرهٔ اصلی هنوز شنونده نگذاشته بود از دست نرود
    var tries = 0;
    var ping = setInterval(function () {
      tries++;
      try { T.event.emit(EV_READY, Date.now()); } catch (e) {}
      if (rendered || tries > 25) clearInterval(ping);
    }, 150);
    try { T.event.emit(EV_READY, Date.now()); } catch (e) {}
  } else {
    var m = document.getElementById('hb-msg');
    if (m) m.textContent = 'این پنجره فقط در نسخهٔ نصبیِ ویندوز کار می‌کند.';
  }
})();
</script>

</body>
</html>
