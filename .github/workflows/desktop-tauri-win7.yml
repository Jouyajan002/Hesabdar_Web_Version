name: ساخت نسخهٔ نصبیِ ویندوز — سازگار با ویندوز ۷ (Tauri)

# این ورک‌فلو یک بیلدِ «سازگار با ویندوز ۷» می‌سازد که روی ویندوز ۷/۸/۱۰/۱۱ — همه —
# اجرا می‌شود. یعنی همین یک بیلد برای همهٔ کاربرانِ دسکتاپ کافی است.
#
# ❗ مهم: برای اینکه گزینهٔ «بروزرسانی» داخلِ برنامه فایلِ درست را بردارد، باید فقط
#    «یک» ورک‌فلوی دسکتاپ روی هر تگ اجرا شود. پس اگر این فایل را فعال می‌کنید،
#    ورک‌فلوی قدیمیِ desktop-tauri.yml را غیرفعال/حذف کنید (توضیح در پیام).
#
# دستی اجرا می‌شود، و با ساختِ تگِ نسخه (مثلاً v1.0.8) خودکار.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows7:
    name: ویندوز ۷+ (x64)
    runs-on: windows-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      # ── تشخیص: دقیقاً ببینیم چه چیزی در ریشهٔ ریپو هست ──────────────────────
      # اگر خطای «failed to watch Cargo.toml» گرفتید، اینجا را ببینید: باید پوشهٔ
      # src-tauri (با Cargo.toml و tauri.conf.json و src\main.rs) «موجود» باشد.
      - name: بررسیِ محتوای ریشهٔ پروژه
        shell: pwsh
        run: |
          Write-Host "پوشهٔ کاری: $(Get-Location)"
          Write-Host "`n— فایل‌ها و پوشه‌های ریشه —"
          Get-ChildItem -Force | Select-Object Mode, Name | Format-Table -AutoSize
          foreach ($m in @('index.html','script.js','src-tauri','src-tauri/Cargo.toml','src-tauri/tauri.conf.json','src-tauri/src/main.rs')) {
            $ok = Test-Path -LiteralPath $m
            Write-Host ("  {0,-34} {1}" -f $m, $(if ($ok) { 'موجود' } else { '*** نیست ***' }))
          }
          if (-not (Test-Path -LiteralPath 'src-tauri/tauri.conf.json')) {
            throw "پوشهٔ src-tauri کامل در مخزن نیست. فایلِ src-tauri را کامل آپلود کنید (خطای watch از همین است)."
          }

      # ══════════════════════════════════════════════════════════════════════
      #  سازگاری با ویندوز ۷ — بخشِ ۱: Rust
      #  ---------------------------------------------------------------------
      #  • toolchainِ پایدار برای «ساختِ خودِ Tauri CLI» نصب می‌شود (بدونِ محدودیتِ MSRV).
      #  • toolchainِ 1.77.2 جداگانه نصب می‌شود و فقط «پروژه» با آن کامپایل می‌گردد؛
      #    چون از Rust 1.78 تابعِ ProcessPrng استفاده می‌شود که در ویندوز ۷ نیست.
      # ══════════════════════════════════════════════════════════════════════
      - name: نصب Rust پایدار (برای ساختِ Tauri CLI)
        uses: dtolnay/rust-toolchain@stable

      - name: نصب toolchainِ 1.77.2 (برای کامپایلِ سازگار با ویندوز ۷)
        run: rustup toolchain install 1.77.2 --profile minimal

      - name: کشِ Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          prefix-key: 'rust-cache-win7'

      - name: کشِ Tauri CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: cargo-tauri-win7-v2-${{ runner.os }}

      - name: نصب Tauri CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # ══════════════════════════════════════════════════════════════════════
      #  سازگاری با ویندوز ۷ — بخشِ ۲: حذفِ زنجیرهٔ ICU
      #  ---------------------------------------------------------------------
      #  نسخهٔ جدیدِ ICU (که از راهِ url→idna می‌آید) MSRVاش ۱.۸۲ است و با 1.77
      #  کامپایل نمی‌شود. با این دستورِ «مستندِ خودِ idna» پیاده‌سازیِ سبک‌ترِ unicode-rs
      #  جایگزین می‌شود و ICU کاملاً از گراف حذف می‌گردد. رفتارِ برنامه تغییر نمی‌کند.
      # ══════════════════════════════════════════════════════════════════════
      - name: حذفِ ICU برای سازگاری با Rust 1.77
        working-directory: src-tauri
        run: cargo update -p idna_adapter --precise 1.0.0

      # ══════════════════════════════════════════════════════════════════════
      #  آماده‌سازیِ dist-web (همان منطقِ ورک‌فلوی اصلی؛ کاملاً درون‌خطی)
      # ══════════════════════════════════════════════════════════════════════
      - name: آماده‌سازیِ فایل‌های وب (dist-web)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = (Get-Location).Path
          $Dist = Join-Path $Root 'src-tauri\dist-web'

          $WebFiles = @(
            'index.html',
            'style.css', 'auth-system.css', 'dashboard-store-info-fix.css', 'mobile-responsive.css',
            'tauri-bridge.js', 'database.js', 'script.js', 'persian-date-utils.js',
            'auth-system.js', 'drive-backup.js', 'instant-update-fix.js', 'delivery-list.js',
            'currency-system.js', 'sync-config.js', 'sync-layer.js', 'auth-cloud.js',
            'device-guard.js',
            'demo-mode.js', 'mobile-fit.js', 'jouya-selftest.js', 'pwa-register.js',
            'manifest.webmanifest', 'version.json'
          )
          $WebDirs = @('assets', 'build')

          if (Test-Path $Dist) { Remove-Item -Recurse -Force $Dist }
          New-Item -ItemType Directory -Force -Path $Dist | Out-Null

          $copied = 0; $missing = @()
          foreach ($f in $WebFiles) {
            $src = Join-Path $Root $f
            if (Test-Path -LiteralPath $src -PathType Leaf) {
              Copy-Item -LiteralPath $src -Destination (Join-Path $Dist $f) -Force
              $copied++
            } else { $missing += $f }
          }
          foreach ($d in $WebDirs) {
            $src = Join-Path $Root $d
            if (Test-Path -LiteralPath $src -PathType Container) {
              Copy-Item -LiteralPath $src -Destination $Dist -Recurse -Force
            } else { $missing += "$d\" }
          }

          if (-not (Test-Path -LiteralPath (Join-Path $Dist 'index.html'))) {
            throw "index.html در ریشهٔ پروژه پیدا نشد ($Root)."
          }

          $mb = [math]::Round(((Get-ChildItem -Recurse -File $Dist | Measure-Object Length -Sum).Sum / 1MB), 2)
          Write-Host "کپی شد: $copied فایلِ ریشه + پوشه‌های $($WebDirs -join ', ')  →  $mb مگابایت"
          if ($missing.Count -gt 0) { Write-Host "موجود نبود (رد شد): $($missing -join ', ')" }

      # ══════════════════════════════════════════════════════════════════════
      #  ساختِ نصب‌کننده — پروژه با 1.77.2 کامپایل می‌شود (سازگار با ویندوز ۷).
      #  با env، این toolchain به بیلدِ داخلیِ Cargo که Tauri صدا می‌زند هم می‌رسد.
      # ══════════════════════════════════════════════════════════════════════
      # نکته دربارهٔ خطای «failed to watch ...Cargo.toml»:
      #   وقتی cargo tauri build از «ریشهٔ مخزن» اجرا شود، نسخهٔ جدیدِ tauri-cli سعی
      #   می‌کند Cargo.toml را در همان ریشه watch کند — ولی Cargo.toml در src-tauri است،
      #   نه ریشه → خطا. راه‌حلِ قطعی: بیلد را از «داخلِ src-tauri» اجرا کنیم تا هم
      #   tauri.conf.json و هم Cargo.toml در پوشهٔ جاری باشند. خروجی همان
      #   src-tauri/target/release/bundle می‌ماند، پس مراحلِ بعدی تغییر نمی‌کنند.
      - name: ساخت نصب‌کننده (سازگار با ویندوز ۷)
        working-directory: src-tauri
        env:
          RUSTUP_TOOLCHAIN: "1.77.2"
        run: cargo tauri build

      - name: فهرستِ خروجی‌ها
        if: always()
        shell: pwsh
        run: |
          $b = 'src-tauri/target/release/bundle'
          if (Test-Path $b) {
            Get-ChildItem -Recurse -File $b |
              Select-Object @{n='فایل';e={$_.Name}}, @{n='مگابایت';e={[math]::Round($_.Length/1MB,2)}} |
              Format-Table -AutoSize
          } else { Write-Host "پوشهٔ bundle ساخته نشد." }

      - name: بارگذاریِ نصب‌کننده (آرتیفکت)
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-windows7-setup
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: انتشار در Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: false
