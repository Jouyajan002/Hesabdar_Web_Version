name: ساخت نسخهٔ دسکتاپ (Tauri)

# دستی اجرا می‌شود، و همچنین با ساختِ یک تگِ نسخه (مثلاً v1.0.7) خودکار اجرا می‌گردد.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ویندوز: خروجی NSIS (setup.exe) + MSI — همان «فایلِ نصبیِ سبک»
          - os: windows-latest
            label: windows
            args: ''
          # لینوکس: deb + AppImage
          - os: ubuntu-22.04
            label: linux
            args: ''
          # مک: dmg (اپل‌سیلیکون و اینتل)
          - os: macos-latest
            label: macos
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب پیش‌نیازهای لینوکس
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libssl-dev \
            libgtk-3-dev

      - name: نصب Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: کشِ Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: نصب Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: ساخت نصب‌کننده
        run: cargo tauri build ${{ matrix.args }}

      # ── جمع‌آوریِ خروجی‌ها ──
      - name: بارگذاریِ خروجیِ ویندوز
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-windows
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: بارگذاریِ خروجیِ لینوکس
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-linux
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: بارگذاریِ خروجیِ مک
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-macos
          if-no-files-found: warn
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg

      # ── انتشار در Releases (فقط وقتی تگ زده شده باشد) ──
      - name: انتشار در Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
