name: ساخت نسخه دسکتاپ (Tauri)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: windows

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Rust
        uses: dtolnay/rust-toolchain@stable

      - name: کش Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: نصب Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: بررسی فایل‌های وب
        shell: pwsh
        run: |
          if (!(Test-Path "dist-web")) {
            Write-Error "dist-web directory not found."
            exit 1
          }

          if (!(Test-Path "dist-web/index.html")) {
            Write-Error "dist-web/index.html not found."
            exit 1
          }

          Write-Host "dist-web OK"

      - name: ساخت نصب‌کننده ویندوز
        working-directory: src-tauri
        run: cargo tauri build

      - name: بارگذاری خروجی ویندوز
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: انتشار در Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: true
