name: ساخت نسخهٔ دسکتاپ (Tauri)

# دستی اجرا می‌شود، و همچنین با ساختِ یک تگِ نسخه (مثلاً v1.0.7) خودکار اجرا می‌گردد.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ویندوز: خروجی NSIS (setup.exe) + MSI — همان «فایلِ نصبیِ سبک»
          - os: windows-latest
            label: windows
            args: ''

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Rust
        uses: dtolnay/rust-toolchain@stable

      - name: کشِ Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: نصب Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: ساخت نصب‌کننده
        working-directory: src-tauri
        run: cargo tauri build ${{ matrix.args }}

      # ── جمع‌آوریِ خروجی‌ها ──
      - name: بارگذاریِ خروجیِ ویندوز
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-windows
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # ── انتشار در Releases (فقط وقتی تگ زده شده باشد) ──
      - name: انتشار در Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: false
