[package]
name         = "hesabdar"
version      = "1.0.9"
description  = "حسابدار — سیستم مدیریت فروشگاه"
authors      = ["Hesabdar"]
edition      = "2021"
rust-version = "1.77"

# نکته: نامِ باینری عمداً لاتین است (hesabdar) تا مسیرهای فایل/نصب هیچ‌وقت به کاراکترِ
# غیرِاَسکی برنخورند؛ نامِ نمایشیِ برنامه در tauri.conf.json «حسابدار» است.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri      = { version = "2", features = [] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── ورودِ گوگل با OAuth loopback (فایلِ src/google_oauth.rs) ───────────────────────
# sha2 / url / getrandom عمداً هم‌نسخهٔ همان‌هایی‌اند که خودِ Tauri در Cargo.lock می‌آورد
# (sha2 0.10، url 2، getrandom 0.3) تا نسخهٔ تکراری ساخته نشود. ureq بدونِ gzip و با rustls
# (گواهی‌های ریشه داخلِ باینری؛ نیازی به SChannel/ویندوزِ جدید ندارد).
ureq       = { version = "2", default-features = false, features = ["tls"] }
sha2       = "0.10"
url        = "2"
getrandom  = "0.3"

# ── فقط ویندوز: پنلِ اشتراکِ سیستم (WinRT DataTransferManager) ──────────────────
# نسخه‌ها عمداً همان نسخه‌هایی است که خودِ Tauri 2.12 در Cargo.lock می‌آورد
# (windows 0.62.2 و windows-collections 0.3.2)، تا نسخهٔ تکراری ساخته نشود و
# نوعِ HWND که Tauri برمی‌گرداند دقیقاً همان نوعی باشد که اینجا استفاده می‌شود.
[target.'cfg(windows)'.dependencies]
# ⚠ فهرستِ فیچرها «حدسی» نیست: هر نوع و هر متدی که استفاده می‌شود در سورسِ خودِ
#   windows 0.62.2 بررسی شده و گیتِ #[cfg(feature = …)] آن استخراج شده است.
#   نکتهٔ غافلگیرکننده: StorageFile پشتِ فیچرِ «Storage_Streams» است، نه «Storage»
#   (چون IStorageFile به Streams وابسته است) — و DataPackage::SetStorageItems پشتِ
#   «Storage». نبودنِ Storage_Streams همان خطای «no StorageFile in Storage» را می‌دهد.
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
    "ApplicationModel_DataTransfer",
    "Win32_Foundation",
    "Win32_UI_Shell",
] }
windows-collections = "0.3"

# بیلدِ کم‌حجم.
# نکته: عمداً "thin" LTO انتخاب شده و نه fat LTO. با fat LTO حجمِ نهایی تقریباً همان است
# ولی مرحلهٔ لینک چند گیگابایت RAM می‌خواهد و روی ماشین‌های معمولی/رانرهای کوچک با خطای
# out-of-memory (SIGKILL) شکست می‌خورد. thin LTO همان کاهشِ حجم را با مصرفِ حافظهٔ عادی می‌دهد.
[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = "s"
panic         = "abort"
strip         = true
incremental   = false
